# aimarket-emporion. Unprefixed short names on PyPI are claimable by strangers
# (see oracles/core/pyproject.toml). Distribution name is always aimarket-*.
[project]
name = "aimarket-emporion"
version = "0.1.0"
description = "EMPORION — public-record facts for agents that trade: EU VAT validity (VIES), legal entities (GLEIF LEI), ECB reference rates, sanctions-list lookups (OFAC, EU, UN), and Bitcoin-anchored timestamps (OpenTimestamps), each answer signed with its sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aimarket-oracle-core>=0.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.34",
    # XML of the EU and UN sanctions lists comes from outside: parse it defused.
    "defusedxml>=0.7.1",
    # The OpenTimestamps reference library (LGPL-3.0) for proof (de)serialisation and
    # operations; EMPORION does its own HTTP to calendars and explorers (allowlisted).
    "opentimestamps>=0.4.5,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
]

[project.urls]
Homepage = "https://emporion.modelmarket.dev/"
Source = "https://github.com/alexar76/emporion"
Changelog = "https://github.com/alexar76/emporion/blob/main/CHANGELOG.md"
"Landing on GitHub Pages" = "https://alexar76.github.io/emporion/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emporion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
