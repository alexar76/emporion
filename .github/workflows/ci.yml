name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install oracle-core + symmartys
        run: |
          python -m pip install --upgrade pip
          if [[ -d vendor/oracle-core ]]; then
            pip install -e "vendor/oracle-core[pqc]" -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi
          pip install pytest-cov

      # Every test runs on excerpts of real answers; none reaches a live source.
      - name: Pytest + coverage
        run: |
          python -m pytest tests/ -q --tb=short --maxfail=5 \
            --cov=symmartys --cov-report=term-missing --cov-report=json:coverage.json
          python3 scripts/generate_coverage_badge.py coverage.json docs/badges/coverage.svg
          python3 scripts/generate_tests_badge.py --rootdir . --out docs/badges/tests.json
          echo "Coverage: $(grep -oE '[0-9]+%' docs/badges/coverage.svg | tail -1)"
          echo "Tests: $(python3 -c "import json;print(json.load(open('docs/badges/tests.json'))['message'])")"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build the standalone image
        run: |
          # The mirror vendors oracle-core here; without it the image cannot build.
          test -f vendor/oracle-core/pyproject.toml || { echo "::error::vendor/oracle-core is missing"; exit 1; }
          docker build -f Dockerfile.standalone -t symmartys:ci .

      - name: It starts and answers its manifest
        run: |
          docker run -d --name symmartys-ci -p 127.0.0.1:9351:9351 symmartys:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9351/health && break
            sleep 2
          done
          curl -sf -o health.json http://127.0.0.1:9351/health
          curl -sf -o manifest.json http://127.0.0.1:9351/ai-market/v2/manifest
          # The manifest lists exactly what the running app serves, signed; no capability count is
          # written here, so adding one does not turn CI red (a hard-coded 7 did, at 0.2.0).
          python3 -c "import json; h=json.load(open('health.json')); m=json.load(open('manifest.json')); ids={t['capability_id'] for t in m['tools']}; assert len(ids) == h['capabilities'] == len(m['tools']), (len(ids), h['capabilities']); assert m['signature'], 'unsigned manifest'; assert {'symmartys.vat.check@v1', 'symmartys.sources@v1'} <= ids, ids; print(f'manifest: {len(ids)} capabilities, signed')"
          docker rm -f symmartys-ci
